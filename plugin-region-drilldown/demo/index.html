<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行政区圆圈下钻插件演示</title>
  <link rel="stylesheet" href="./vendor/Cesium/Widgets/widgets.css">
  <style>
    html,body,#cesium-container{width:100%;height:100%;margin:0;overflow:hidden;background:#06111d}
    #guide{position:absolute;top:18px;right:18px;z-index:30;width:310px;padding:16px 18px;border:1px solid rgba(85,214,255,.25);border-radius:14px;background:rgba(6,20,34,.88);box-shadow:0 18px 45px rgba(0,0,0,.3);color:#eaf8ff;font:13px/1.75 "PingFang SC","Microsoft YaHei",sans-serif;backdrop-filter:blur(14px)}
    #guide h1{margin:0 0 8px;font-size:17px}#guide p{margin:5px 0;color:#a9d4e6}#guide b{color:#55d6ff}
    .cesium-viewer-bottom,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer,.cesium-viewer-toolbar{display:none!important}
  </style>
</head>
<body>
  <div id="cesium-container"></div>
  <aside id="guide">
    <h1>行政区圆圈下钻演示</h1>
    <p>点击 <b>中国</b> 圆圈进入省级，再点击浙江、广东或四川进入城市。</p>
    <p>左上角可以返回上一级。</p>
    <p>演示只使用少量模拟区域。正式使用时，区域数据由 OneEarth 后端接口提供。</p>
  </aside>
  <script>window.CESIUM_BASE_URL = "./vendor/Cesium/";</script>
  <script src="./vendor/Cesium/Cesium.js"></script>
  <script src="../dist/region-drilldown.umd.js"></script>
  <script src="./mock-provider.js"></script>
  <script src="./main.js"></script>
</body>
</html>
